name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Check dist metadata
        run: twine check dist/*

      - name: Install wheel into clean environment
        run: |
          python -m venv .venv-check
          .venv-check/bin/pip install --no-index --find-links=dist rpacore
          .venv-check/bin/rpacore version

      - name: Smoke import public API
        run: |
          .venv-check/bin/python - <<'EOF'
          import rpacore
          assert hasattr(rpacore, 'Engine')
          assert hasattr(rpacore, 'Transaction')
          assert hasattr(rpacore, 'Skill')
          assert hasattr(rpacore, 'BusinessException')
          assert hasattr(rpacore, 'SystemException')
          assert hasattr(rpacore, 'Status')
          assert hasattr(rpacore, 'QueueRunSummary')
          assert hasattr(rpacore, 'run_queue_loop')
          print('smoke import OK')
          EOF

      - name: Verify examples/ absent from wheel
        run: |
          python - <<'EOF'
          import zipfile, sys, glob
          wheels = glob.glob('dist/*.whl')
          assert wheels, 'No wheel found in dist/'
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
          leaked = [n for n in names if n.startswith('examples/')]
          if leaked:
              print('ERROR: examples/ leaked into wheel:', leaked)
              sys.exit(1)
          print('wheel contents OK — examples/ absent')
          EOF
