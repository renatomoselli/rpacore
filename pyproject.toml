[project]
name = "oref"
version = "0.1.0"
description = "Open Robotic Enterprise Framework — deterministic, stateful RPA in Python"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
screenshots = [
    "mss>=9.0",
]

[tool.setuptools.packages.find]
include = ["oref*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
